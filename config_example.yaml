websrv:
  port: "1337"
  # Extra origins allowed to call /api/ with cookies (CORS). The site URL and main.onion are always allowed.
  # cors_origins: ["https://tools.example.com"]
  # Site default language (en, de, nl, zange)
  language: en
  # Let visitors pick their own language in the settings
  allow_language_change: false
  # Languages offered in that picker (empty or unset = all). A stored choice that is no longer listed falls back to language.
  languages:
    - en
    - de
    - nl
    - zange
  cache: false
  eps: 155
  default_thumb_size: m
  background: true
  log_user_ips: false
  hash_user_ips: true
  # Device fingerprint of anonymous users (hashed in the browser, used only to enforce bans).
  # Off by default. false = never computed or stored; already stored fingerprints are purged. Shown on /privacy.
  anon_hw_fingerprint: false
  # Data retention in days (0 = keep forever). Shown to users on /privacy.
  retention_ip_days: 30              # stored IPs: user_ips rows deleted, IP columns elsewhere set to NULL
  retention_activity_log_days: 90    # anonymous activity log (actions, IP, fingerprints)
  retention_login_attempts_days: 30  # failed/successful login attempts (hashed IP + username)
  retention_sessions_days: 365       # sessions unused this long are deleted
  retention_fingerprint_days: 365    # device fingerprint of anonymous identities inactive this long
  description: Example Description
  # Themes visitors can pick in the settings (all available ones); theme is the site default
  themes:
    - amoled
    - atmos
    - f0ck
    - f0ck95
    - f0ck95d
    - '95'
    - iced
    - orange
    - p1nk
    - '4d'
    - light
    - paper
    - term
    - xd
  theme: amoled
  # Site frontend: f0ckm (default), or an alternative one from views/frontends/ (w0bm, f0ckv2).
  # Pages a frontend has no template for use the f0ckm one.
  frontend: f0ckm
  # Let visitors pick their own frontend with /frontend/<name> or ?frontend=<name> (kept in a cookie)
  frontend_switch: true
  default_font: Manrope-Regular.woff2   # font file (built-in: public/s/fonts-builtin; add your own to the fonts dir)
  default_layout: legacy
  custom_favicon: /s/img/favicon.gif   # admin panel → Branding: an uploaded favicon replaces it
  custom_brand_image: []               # admin panel → Branding: an uploaded image replaces it
  custom_navbar_brand_text: ""         # shown next to the brand image; the admin panel text replaces it
  show_koepfe: false
  hide_sidebar_default: true
  koepfe: []
  enable_tor_hs: false
  enable_global_chat: false
  enable_danmaku: true
  private_messages: false
  dm_attachments: true
  dm_unencrypted: false
  dm_attachment_expiry_days: 90
  halls_enabled: false
  userhalls_enabled: false
  enable_userhall_image_upload: false
  enable_oc: false
  abyss_enabled: true
  meme_creator: false
  enable_cleanup: false
  enable_data_export: true
  # Ban accounts (not admins/mods) that haven't logged in for this many days; checked every 6 hours.
  # 0 = off. On a database with old accounts this bans most of them at once; lift those bans with
  # `f0ckm users unban-inactive`.
  inactivity_ban_days: 0
  enable_user_api_keys: false
  enable_user_invites: true
  user_invite_slots: 2
  invite_criteria:
    uploads: 150
    age_days: 90
    comments: 500
    tags: 1000
  cleanup_timeframe_days: 30
  # Albums: several files uploaded as one post (album tab on the upload form); false turns it off
  albums_enabled: false
  web_url_upload: true
  enable_youtube_upload: true
  web_meta_extraction: true
  # Global switch for the repost/duplicate check on every upload path (web, URL/link, chat bots, `f0ckm import` default).
  # false = check on: same checksum, visually similar file (phash) or an already uploaded URL is rejected with a link to the original.
  # true  = check off: duplicates are allowed; a re-uploaded identical file is stored as a symlink to the existing copy, not twice.
  bypass_duplicate_check: false
  shitpost_mode: false
  shitpost_require_rating: false
  shitpost_min_tags: 0
  protect_files: false
  enable_dynamic_thumbs: false
  allowed_comment_images:
    - i.imgur.com
    - tenor.com
    - giphy.com
  # Content-Security-Policy. Scripts only run from this site or with the per-page nonce.
  # report_only: true logs violations (see "[CSP]" in the log) without blocking anything.
  csp:
    enabled: true
    report_only: false
    extra_img: []       # more origins, e.g. https://cdn.example.com
    extra_media: []
    extra_connect: []
    extra_frame: []
    extra_script: []
  show_mime_picker: true
  embed_youtube_in_comments: true
  allow_fileupload_comments: false
  allow_comment_deletion: false
  enable_comment_polls: false
  fileupload_comments_multifile: true
  fileupload_comments_size: 104857600
  fileupload_comments_max: 5
  fileupload_comments_mode: attachment
  fileupload_comments_mimes:
    - image
    - video
    - audio
  show_content_warning: true
  # Comment layout for guests and users who haven't picked one: 0 = tree (threaded replies), 1 = linear (flat, oldest first).
  # Users can change it in their settings unless an admin locked it for their account.
  default_comment_display_mode: 1
  phrases:
    - Hello World
  ban_video: ""
  enable_autoplay: true
  enable_swiping: true
  enable_profile_description: true
  user_alternative_infobox: true
  user_banner_enabled: true
  comment_banner_enabled: true
  comment_banner_max_height: 300
  user_alternative_steuerung: false
  expose_repost_links_to_guests: false
  enable_swf: false
  swf_thumb: /s/img/swf.png
  enable_archive: false
  archive_thumb: /s/img/archive.webp
  enable_item_title: true
  open_registration: false
  open_registration_web_toggle: false
  open_registration_require_mail_andor_token: false
  private_society: false
  private_society_gate: cloudflare
  private_society_gate_location: Frankfurt
  private_society_gate_template: _gate_template
  public_nsfw: false
  public_untagged: false
  paths:
    images: /b
    thumbnails: /t
    coverarts: /ca
    emojis: /emojis
    memes: /memes
# PWA web app manifest served at /manifest.json. Works as it is: nothing here needs to be set.
# Every key below is optional and replaces the default shown next to it; any other Web App Manifest
# key works too, and a key set to null is dropped from the manifest.
manifest:
  # name: f0ckm                 # default: main.url.domain
  # short_name: f0ckm           # default: main.url.domain
  # description: ""             # default: websrv.description
  # display: standalone
  # background_color: "#000000"
  # theme_color: "#0096ff"      # also used for <meta name="theme-color">
  # categories: [entertainment, social, memes]
  #
  # icons: leave unset. By default the 192x192 and 512x512 PNGs that installing the app needs are
  # made automatically from the site's favicon (admin panel upload or websrv.custom_favicon;
  # needs ImageMagick) into public/s/img/manifest/, and remade when the favicon changes.
  # Only set icons to use your own image files instead; that turns the automatic icons off:
  # icons:
  #   - { src: /s/img/my-icon-192.png, sizes: 192x192, type: image/png, purpose: any }
  #   - { src: /s/img/my-icon-512.png, sizes: 512x512, type: image/png, purpose: any }
clients:
  - type: tg
    enabled: false
    token: ""
    pollrate: 1001
  - type: matrix
    enabled: false
    baseUrl: https://matrix.org
    token: ""
    userId: "@user:matrix.org"
    channels: []
    upload_channel_id: ""
    notification_channel_id: ""
  - type: irc
    enabled: false
    network: example
    host: irc.example.net
    port: 6697
    ssl: true
    selfSigned: true
    sasl: false
    nickname: bot
    username: bot
    password: ""
    realname: bot
    channels:
      - "#example"
  # Slack via Socket Mode: token = bot token (xoxb-, scopes chat:write, channels:read, users:read,
  # event subscriptions message.channels/message.groups), appToken = app-level token (xapp-, connections:write)
  - type: slack
    enabled: false
    token: ""
    appToken: ""
