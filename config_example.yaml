main:
  url:
    full: https://example.com
    domain: example.com
    regex: example\.com
  onion: http://your-onion-address.onion
  # Tor SOCKS proxy for outgoing fetches; socks5h resolves DNS through Tor. The tor container in Docker,
  # socks5h://127.0.0.1:9050 when running the server outside Docker
  socks: socks5h://tor:9050
  # JavaScript runtime yt-dlp uses for YouTube (link uploads): deno (default, in the Docker image), node, bun or quickjs
  # ytdlp_js_runtime: deno
  # Chat bots (IRC/Slack/Telegram/Matrix): YouTube links become embeds like on the web upload.
  # Set true to download them with yt-dlp instead.
  # bot_youtube_download: false
  mail: admin@example.com
  maxfilesize: 104857600
  adminmultiplier: 3.5
  upload_limit: 300
  ignored:
    - example.net
    - example.org
  invite_secret: YOUR_SECRET_HERE
  # IP hashing secret. Prefer the IP_HASH_SECRET environment variable (.env) so it isn't stored next to the data.
  # Falls back to invite_secret when neither is set.
  ip_hash_secret: ""
  # Previous IP hash secrets, only used to match bans hashed before a rotation (invite_secret is added automatically)
  ip_hash_legacy_secrets: []
  hide_comments_from_public: false
  # Anonymized view: uploaders, commenters and favs show as "anonymous" (no names, avatars, banners or item source),
  # and user profiles, user feeds, user halls and user tags are blocked. Registered users always see names.
  # guest_anonymize: for visitors who are not logged in
  guest_anonymize: false
  # anon_anonymize: for anonymous-access users (enable_anonymous_access); they can still open their own profile/favs.
  # anonymous_permissions.anonymize_users overrides this when set.
  anon_anonymize: true
  timezone: UTC
  development: false
allowedModes:
  - sfw
  - nsfw
  - untagged
  - all
  - nsfl
enable_nsfl: false
enable_pdf: false
enable_comments: true
enable_private_uploads: false
enable_expiring_uploads: false
default_upload_visibility: 0
allow_user_upload_visibility: false
enable_item_slugs: true
enable_anonymous_access: false
anonymous_permissions:
  upload: false
  comment: true
  comment_attachments: false
  comment_vote: true
  poll_vote: true
  tag: true
  tag_vote: true
  favorite: true
  rate_item: false
  filter: true
  exclude_tags: true
  chan: false
  anonymize_users: true
  allowed_modes:
    - sfw
    - nsfw
    - untagged
    - all
    - nsfl
  allowed_mimes:
    - image
    - video
    - audio
    - flash
    - pdf
onara: false
nsfl_tag_id: 4
allowedMimes:
  - audio
  - image
  - video
  - application/x-shockwave-flash
  - application/vnd.adobe.flash.movie
