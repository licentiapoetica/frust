[package]
name = "f0ckm"
version = "3.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "f0ckm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "uuid", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
minijinja = { version = "2", features = ["loader", "json", "urlencode", "speedups", "builtins", "debug"] }
minijinja-contrib = { version = "3", features = ["pycompat", "datetime"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
fancy-regex = "0.14"
sha2 = "0.11"
md-5 = "0.11"
hmac = "0.13"
scrypt = { version = "0.12", default-features = false }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
form_urlencoded = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "gzip", "brotli"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
arc-swap = "1"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
notify = "7"
mime_guess = "2"
subtle = "2"
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
ciborium = "0.2"
httpdate = "1"
webauthn-rs = { version = "0.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }
argon2 = "0.5"
unicode-normalization = "0.1"
multer = "3"
