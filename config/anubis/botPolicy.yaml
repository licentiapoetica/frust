# Anubis bot policy for f0ckm (docker-compose.anubis.yml; README "Bot protection").
# Edits apply after: docker compose restart anubis
#
# Browsers (a user agent with "Mozilla" or "Opera") solve a proof of work once, then a cookie lets
# them in for 7 days (COOKIE_EXPIRATION_TIME). The cookie only works from the IP that solved it, so a
# bot on rotating IPs pays again for every IP. The check needs JavaScript: without it the clearnet site
# can't be reached; the .onion address goes straight to f0ckm and keeps working.
# Clients that don't claim to be a browser (API tools, feed readers, webhooks) pass unchecked.
#
# Rules are checked top to bottom; reference: https://anubis.techaro.lol/docs/admin/policies

bots:
  # Anubis' shipped lists (data/ in the Anubis release): known-bad bots, AI crawlers,
  # verified search engines (allowed), the well-known/favicon/robots.txt/sitemap routes (allowed)
  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml
  - import: (data)/common/domain-fronting.yaml
  - import: (data)/meta/ai-block-aggressive.yaml
  - import: (data)/crawlers/_allow-good.yaml
  - import: (data)/clients/x-firefox-ai.yaml
  - import: (data)/crawlers/xai.yaml
  - import: (data)/common/keep-internet-working.yaml

  # Files (media, thumbnails, avatars, emojis, CSS/JS) pass without a check, so images and videos
  # linked or embedded elsewhere keep loading; f0ckm's own rules for them (ratings, private items)
  # still apply. Pages and the API stay checked, and bots that can't get the pages don't learn the
  # file names. Delete this rule to check files too.
  - name: f0ckm-files
    path_regex: ^/(?:a|b|c|e|t|ca|s|memes|tag_cache|hall_cache|hall_custom)/
    action: ALLOW

  # A swarm with one fixed user agent can be turned away here outright, e.g.:
  # - name: chrome-154-swarm
  #   user_agent_regex: ^Mozilla/5\.0 \(Windows NT 10\.0; Win64; x64\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/154\.0\.0\.0 Safari/537\.36$
  #   action: DENY

  # Everything claiming to be a browser gets the proof of work (thresholds below)
  - name: generic-browser
    user_agent_regex: Mozilla|Opera
    action: WEIGH
    weight:
      adjust: 10

dnsbl: false

# Hidden links on the check page that only scrapers follow (into pages of filler text); clients
# caught there often get more weight. Hits: ^/.within.website/x/cmd/anubis/api/honeypot/
honeypot:
  enabled: true
  implementation: naive

# Link previews (chat apps, social sites) of a checked page still get its title, description and
# picture: Anubis copies the page's Open Graph tags into the check page.
openGraph:
  enabled: true
  considerHost: false
  ttl: 24h

# Anubis' default: scrapers tend to stop once they get a 200
status_codes:
  CHALLENGE: 200
  DENY: 200

store:
  backend: memory
  parameters: {}

# Difficulty = leading zero hex digits of a SHA-256: 4 takes a phone well under a second
thresholds:
  - name: minimal-suspicion
    expression: weight <= 0
    action: ALLOW
  - name: browser
    expression:
      all:
        - weight > 0
        - weight < 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4
  - name: extreme-suspicion
    expression: weight >= 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 6
