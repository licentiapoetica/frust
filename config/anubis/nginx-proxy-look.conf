# Anubis' check page in f0ckm's look, for the bundled nginx-proxy (f0ckm-nginx).
# docker-compose.anubis.yml mounts this as /etc/nginx/vhost.d/default, which nginx-proxy includes in the
# server {} of the domain, and the files below into the container. Anubis builds its own files into its
# binary, so the proxy in front answers their URLs with these. An own nginx gets the same locations from
# install.sh (README "Bot protection").
location = /.within.website/x/xess/xess.min.css { alias /f0ckm-anubis/css/anubis.css; }
location = /.within.website/x/cmd/anubis/static/img/pensive.webp { alias /f0ckm-anubis/img/checking.webp; }
location = /.within.website/x/cmd/anubis/static/img/happy.webp   { alias /f0ckm-anubis/img/passed.webp; }
location = /.within.website/x/cmd/anubis/static/img/reject.webp  { alias /f0ckm-anubis/img/denied.webp; }
