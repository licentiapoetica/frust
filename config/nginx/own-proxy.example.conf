# Example nginx site for running f0ckm behind your own reverse proxy (install.sh → "bring my own").
# f0ckm listens on 127.0.0.1:1337. Replace f0ck.example and the certificate paths, then
#   cp own-proxy.example.conf /etc/nginx/sites-available/f0ckm.conf  (or conf.d/), nginx -t, reload.
# Other proxies need the same: Host and client-IP headers, X-Forwarded-Proto, WebSocket upgrade, big uploads.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name f0ck.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name f0ck.example;

    ssl_certificate     /etc/letsencrypt/live/f0ck.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/f0ck.example/privkey.pem;

    # Uploads can be large and slow
    client_max_body_size 10000M;
    client_body_timeout 120s;
    client_header_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # f0ckm takes the client IP from X-Real-IP / X-Forwarded-For (bans, rate limits, sessions)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # f0ckm checks these first; clear them so clients can't fake their IP (keep CF-Connecting-IP
        # only when Cloudflare sits in front and nothing else can reach this server)
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";

        # WebSocket for live notifications (/api/notifications/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        proxy_request_buffering off;
    }
}
