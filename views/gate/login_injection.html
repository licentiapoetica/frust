{#- Hidden login/register modal of the private society gate (index.mjs getGateLoginInjection).
    Static apart from the captcha switch (`captcha`). -#}
<link rel="stylesheet" href="/s/css/gate.css?v={{ mtime("/public/s/css/gate.css") }}">
<div id="hot-corner"></div>

<div id="gate-modal">
  <div class="gate-modal-box">
    <button id="gate-modal-close">&times;</button>

    <!-- Login View -->
    <div id="gate-login-view">
      <form id="gate-login-form" class="gate-form" novalidate>
        <h2 class="gate-form-title">Sign in</h2>
        <div id="gate-login-error" class="gate-msg gate-msg-error"></div>
        <input type="text" name="username" placeholder="Username or email" autocomplete="off" required class="gate-input" />
        <input type="password" name="password" placeholder="Password" autocomplete="off" required class="gate-input" />
        <label class="gate-kmsi"><input type="checkbox" name="kmsi"> Stay signed in</label>
        <button type="submit" id="gate-login-btn" class="gate-submit-btn">Sign in</button>
        <div class="gate-or-divider">
          <hr>
          <span>or</span>
          <hr>
        </div>
        <button type="button" id="gate-passkey-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          Sign in with Passkey
        </button>
        <p class="gate-form-footer">
          No account? <a href="#" id="gate-to-register" class="gate-form-link">Register</a>
        </p>
      </form>
    </div>

    <!-- Register View -->
    <div id="gate-register-view">
      <form id="gate-register-form" class="gate-form" novalidate>
        <h2 class="gate-form-title">Create account</h2>
        <div id="gate-register-error" class="gate-msg gate-msg-error"></div>
        <div id="gate-register-ok" class="gate-msg gate-msg-ok"></div>
        <input type="text" name="username" placeholder="Username" autocomplete="off" required class="gate-input" />
        <input type="password" name="password" placeholder="Password (min. 20 characters)" autocomplete="off" required minlength="20" class="gate-input" />
        <input type="password" name="password_confirm" placeholder="Confirm password" autocomplete="off" required minlength="20" class="gate-input" />
        <input type="text" name="token" placeholder="Invite token" autocomplete="off" class="gate-input" />
        <input type="text" name="email_confirm_field" class="gate-honeypot" tabindex="-1" autocomplete="off" />
        {% if captcha %}<cap-widget data-cap-api-endpoint="/api/cap/" {% include "snippets/cap-i18n.html" %}></cap-widget>{% endif %}
        <button type="submit" id="gate-register-btn" class="gate-submit-btn">Create account</button>
        <p class="gate-form-footer">
          <a href="#" id="gate-to-login" class="gate-form-link">Back to sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script src="/s/js/views/gate/login_injection.js?v={{ mtime("/public/s/js/views/gate/login_injection.js") }}"></script>
{% if captcha %}<script src="/s/cap/cap-config.js?v={{ mtime("/public/s/cap/cap-config.js") }}"></script><script src="/s/cap/cap.min.js?v=0.1.58" defer></script>{% endif %}
