{% include "snippets/header.html" %}

<div class="pagewrapper">
<div id="main">
    <div class="subs-page">
        <h2 class="subs-title">{{ t("subscriptions.title") }}</h2>
        {% if items|length == 0 %}
        <div class="subs-empty">
            {{ t("subscriptions.empty") }}
        </div>
        {% else %}
        <div class="subs-container">
            <div class="subs-grid">
                {% include "snippets/subscriptions-grid.html" %}
            </div>
            <div id="footbar" data-end-msg="You reached the end">
                &#9660;
            </div>
        </div>
        {% endif %}
    </div>
    <script src="/s/js/views/subscriptions.js?v={{ mtime("/public/s/js/views/subscriptions.js") }}"></script>
</div>
</div>
</div>
{% include "snippets/footer.html" %}
