{#- Message of a form post without JavaScript (server/src/nojs.rs), as a snackbar at the bottom left.
    f0ckyou.js shows the live ones (f0ckFrontend.flash) in the same box. -#}
<div id="fy-flash" class="fy-flash f0ck-shell-chrome" role="status">{% if nojs_flash %}<div class="fy-toast fy-toast-{{ ("success" if nojs_flash.kind == "success" else "error") }}">{{ nojs_flash.text }}</div>{% endif %}</div>
