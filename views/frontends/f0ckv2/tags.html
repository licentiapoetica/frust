{% include "frontends/f0ckv2/snippets/header.html" %}
<div id="main">
  <div class="index-container">
    <h2>tags</h2>
    <div class="posts v2-cards">
      {% for tt in (toptags or []) %}
      <a href="/tag/{{ tt.safe_tag }}{% if (tagger is defined and tagger) %}?tagger={{ tagger|encode_uri_component }}{% endif %}" data-mime="#{{ tt.tag }}" style="--thumb: url('/tag_image/{{ tt.encoded_tag }}?m={{ ((session.mode if session else 0) or 0) }}')"><p></p><span class="v2-card-sub">{{ tt.total_items }} f0cks</span></a>
      {% else %}
      <p class="v2-empty">no tags</p>
      {% endfor %}
    </div>
  </div>
</div>
{% include "frontends/f0ckv2/snippets/footer.html" %}
