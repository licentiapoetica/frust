{#- partials/report.blade.php ("created by klee") -> POST /api/v2/report -#}
  <form id="webmreport" method="POST" action="/api/v2/report">
    <input type="hidden" name="item_id" value="{{ item.id }}">
    <input type="hidden" name="back" value="{{ url.pathname if url else ("/" ~ item.id) }}{{ url.search if url else "" }}">
    <input type="hidden" name="csrf_token" value="{{ (csrf_token or (session and session.csrf_token) or "") }}">
    <div class="modal fade w2-modal" id="webmreportmodal" tabindex="-1" role="dialog" aria-labelledby="w2-report-title">
      <a href="#_" class="w2-modal-backdrop" aria-label="Close" tabindex="-1"></a>
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="w2-report-title">Report WebM</h4>
          </div>
          <div class="modal-body webmreportmodal">
            So you want to report this webm? Tell us why:<br>
            <br>
            <div class="form-group">
              <label for="reportReasons">
                Reason(s)<br>
                <em>(hold ctrl to select multiple)</em>
              </label>
              <select multiple class="form-control" id="reportReasons" name="categories">
                <option value="wrong_rating">Wrong rating (sfw/nsfw)</option>
                <option value="spam">Shitpost / Spam</option>
                <option value="duplicate">Repost / Duplicate</option>
                <option value="copyright">Copyright</option>
                <option value="illegal">Breaks a rule / Illegal</option>
                <option value="other">Other</option>
              </select>
            </div>
            <label for="reportText">Please explain a bit more detailed why you want to report this webm</label>
            <textarea class="form-control" id="reportText" name="reason" rows="3"></textarea>
            {% if captcha_enabled %}
            <div class="w2-captcha"><cap-widget class="cap-dark" data-cap-api-endpoint="/api/cap/" {% include "snippets/cap-i18n.html" %}></cap-widget>{% include "snippets/cap-image.html" %}</div>
            {% endif %}
            <p>Abuse of this form will be awarded with a permanent ban!</p>
          </div>
          <div class="modal-footer">
            <a href="#_" class="btn btn-dark">Close</a>
            <button type="submit" class="btn btn-dark">Send Report</button>
          </div>
        </div>
      </div>
    </div>
  </form>
