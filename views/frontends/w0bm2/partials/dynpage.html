{#- about/rules/terms: admin-edited Markdown. Shown as text without JS, rendered by dynamic-page.js with it. -#}
<div class="page-header p-2"><h3>{{ w2_heading }}</h3></div>
<div class="box w2-content">
    {% if w2_text %}
    <div class="dynamic-page-content w2-raw-text" id="{{ w2_page }}-dynamic-content">{{ w2_text }}</div>
    <script id="{{ w2_page }}-raw-data" type="application/json">{{ w2_b64|safe }}</script>
    <script src="/s/js/marked.min.js?v={{ mtime("/public/s/js/marked.min.js") }}"></script>
    <script src="/s/js/views/dynamic-page.js?v={{ mtime("/public/s/js/views/dynamic-page.js") }}" data-page="{{ w2_page }}"></script>
    {% endif %}
</div>
