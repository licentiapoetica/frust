{#- partials/tags.blade.php -#}
<div class="tags">
    <div class="tagtest">
    {% if w2_can_tag %}
    <div id="tag-add">
        <form method="post" action="/api/v2/tags/{{ item.id }}" id="w2-tag-form">
        <input type="hidden" name="csrf_token" value="{{ (csrf_token or session.csrf_token or "") }}">
        <input type="hidden" name="back" value="{{ url.pathname if url else ("/" ~ item.id) }}{{ url.search if url else "" }}#webmeditmodal">
        <div class="row">
            <div class="col tag-col">
                <div class="input-group">
                    <input id="tags" type="text" class="form-control" placeholder="Input tags…" name="tagname" data-role="tagsinput" autocomplete="off">
                    <span class="input-group-btn"></span>
                </div>
            </div>
        </div>
    <div class="sendtags">
        <button id="submittags" type="submit" class="btn btn-dark">Submit</button>
    </div>
        </form>
    </div>
    {% endif %}
    </div>
    <label for="tag-display">Manage Tags</label>
    <div class="toggo tag-panel-body">
        <div id="tag-display" class="tag-panel-body" data-can-delete="{{ "1" if is_mod_or_admin else "0" }}">
            {% for tag in item.tags %}
            <span class="badge {% if tag.normalized == "sfw" %}badge-sfw{% elif tag.normalized in ["nsfw", "nsfl"] %}badge-nsfw{% else %}badge-secondary{% endif %}" data-tag="{{ tag.tag }}"><a href="/tag/{{ tag.normalized|encode_uri_component }}" class="badge{% if tag.normalized in ["nsfw", "nsfl"] %} nsfw-text{% endif %}">{{ tag.tag }}</a>{% if is_mod_or_admin %}<a class="delete-tag badge" href="#" title="Delete tag"><i class="fa fa-times"></i></a>{% endif %}</span>
            {% else %}
                No tags yet ...
            {% endfor %}
        </div>
    </div>
</div>
