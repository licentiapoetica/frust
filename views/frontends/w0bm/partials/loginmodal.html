{#- partials/loginmodal.blade.php (+ registermodal footer link). /login redirects to /?login=1,
    which renders this modal open. -#}
<div class="modal fade{% if (url and url.qs and url.qs.login) %} w0bm-modal-open{% endif %}" id="loginmodal" tabindex="-1" role="dialog" aria-labelledby="Login">
    <a href="{% if (url and url.qs and url.qs.login) %}{{ url.pathname }}{% else %}#_{% endif %}" class="w0bm-modal-shade" aria-hidden="true" tabindex="-1"></a>
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <a href="{% if (url and url.qs and url.qs.login) %}{{ url.pathname }}{% else %}#_{% endif %}" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></a>
                <h4 class="modal-title" id="filterModalTitle">Login</h4>
            </div>
            <div class="login_wrapper">
                <div class="col-md-9">
                    {% include "frontends/w0bm/partials/loginform.html" %}
                </div>
            </div>
            <div class="modal-footer">
                <p>Create your account now! <a href="#register" data-toggle="modal" data-target="#register">Click here</a></p>
            </div>
        </div>
    </div>
</div>
