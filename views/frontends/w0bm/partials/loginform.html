<form action="/login" method="post" class="navbar-form w0bm-loginform">
    <input type="text" name="username" placeholder="Username" class="form-control usernamelogin" autocomplete="username" required><br>
    <input type="password" name="password" placeholder="Password" class="form-control passwordlogin" autocomplete="current-password" required><br>
    {% if (captcha or captcha_enabled) %}
    <template class="w0bm-cap-template"><cap-widget class="cap-dark" data-cap-api-endpoint="/api/cap/" {% include "snippets/cap-i18n.html" %}></cap-widget></template>
    {% endif %}
    <div class="w0bm-login-error alert alert-danger" hidden></div>
    <button type="submit" class="btn btn-primary">Login</button> <input id="rememberme" checked type="checkbox" name="kmsi"> <label for="rememberme" id="rember">Remember me?</label>
    {% if smtp_enabled %}<br><a href="/forgot-password" class="w0bm-forgot">Forgot password?</a>{% endif %}
</form>
