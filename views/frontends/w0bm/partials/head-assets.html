{#- <head> of every w0bm page: meta, w0bm CSS, theme switcher (layout.html and shell/header.html) -#}
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#161618">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="keywords" content="Random WebMs, WebMs, Internet Videos">
    <meta name="robots" content="noindex">
    <meta property="og:site_name" content="{{ domain }}" />
    {% if item is defined and item and item.id %}
    <meta property="og:title" content="{{ (item.title or (item.slug if (enable_item_slugs and item.slug) else item.id)) }}">
    <meta property="og:url" content="https://{{ domain }}/{{ (item.slug if (enable_item_slugs and item.slug) else item.id) }}">
    <meta property="og:image" content="https://{{ domain }}{{ item.og_thumbnail }}">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://{{ domain }}{{ item.og_thumbnail }}">
    {% else %}
    <meta property="og:title" content="{% if (page_meta is defined and page_meta.title) %}{{ page_meta.title }} - {% endif %}{{ domain }}">
    {% endif %}
    <meta name="description" content="{% if (page_meta is defined and page_meta.description) %}{{ page_meta.description }}{% else %}{{ site_description }}{% endif %}">
    <link rel="icon" href="{% if (custom_favicon and (custom_favicon|length > 0)) %}{{ custom_favicon }}{% else %}/s/fe/w0bm/img/favicon.png{% endif %}">
    <script src="/s/fe/w0bm/js/early.js?v={{ mtime("/public/s/fe/w0bm/js/early.js") }}"></script>
    <link rel="stylesheet" href="/s/fe/w0bm/css/style.css?v={{ mtime("/public/s/fe/w0bm/css/style.css") }}">
    <link rel="stylesheet" href="/s/fe/w0bm/css/w0bmfonts.css?v={{ mtime("/public/s/fe/w0bm/css/w0bmfonts.css") }}">
    <link rel="stylesheet" href="/s/fe/w0bm/css/font-awesome.min.css?v={{ mtime("/public/s/fe/w0bm/css/font-awesome.min.css") }}">
    <link rel="stylesheet" href="/s/fe/w0bm/css/bootstrap-tagsinput.css?v={{ mtime("/public/s/fe/w0bm/css/bootstrap-tagsinput.css") }}">
    <link rel="stylesheet" href="/s/fe/w0bm/css/video-js.min.css?v={{ mtime("/public/s/fe/w0bm/css/video-js.min.css") }}">
    <link rel="stylesheet" href="/s/fe/w0bm/css/vjsnew.css?v={{ mtime("/public/s/fe/w0bm/css/vjsnew.css") }}">
    <link rel="stylesheet" href="/s/fe/w0bm/css/w0bmcustom.css?v={{ mtime("/public/s/fe/w0bm/css/w0bmcustom.css") }}">
    <link rel="stylesheet" href="/s/fe/w0bm/css/w0bm-fe.css?v={{ mtime("/public/s/fe/w0bm/css/w0bm-fe.css") }}">
    <link rel="stylesheet" href="/s/css/glitchfx.css?v={{ mtime("/public/s/css/glitchfx.css") }}">
    <link rel="stylesheet" href="/s/css/comment-fx.css?v={{ mtime("/public/s/css/comment-fx.css") }}">
    {% if brand_font_css %}<link rel="stylesheet" id="brand-font-css" href="{{ brand_font_css }}">{% endif %}
    <link rel="alternate stylesheet" disabled href="/s/fe/w0bm/css/w0bm_override.css?v={{ mtime("/public/s/fe/w0bm/css/w0bm_override.css") }}" title="DARK">
    <link rel="alternate stylesheet" disabled href="/s/fe/w0bm/css/chilledblue.css?v={{ mtime("/public/s/fe/w0bm/css/chilledblue.css") }}" title="Chilledblue">
    <link rel="alternate stylesheet" disabled href="/s/fe/w0bm/css/glitch.css?v={{ mtime("/public/s/fe/w0bm/css/glitch.css") }}" title="Glitch">
    <link rel="alternate stylesheet" disabled href="/s/fe/w0bm/css/epilepsie.css?v={{ mtime("/public/s/fe/w0bm/css/epilepsie.css") }}" title="Epilepsie">
    {#- the phone layout: last, after the themes -#}
    <link rel="stylesheet" media="(max-width: 767px)" href="/s/fe/w0bm/css/w0bm-mobile.css?v={{ mtime("/public/s/fe/w0bm/css/w0bm-mobile.css") }}">
    {% if enable_swf %}<script src="/s/js/flash-embed.js?v={{ mtime("/public/s/js/flash-embed.js") }}"></script>{% endif %}
