<div class="pagewrapper">
<div id="main">
  {% if log %}
  <h1>last {{ log|length }} entries:</h1>
  <div class="logwrap">
  {% for key, line in log|entries %}
    <p>{{ line }}</p>
  {% endfor %}
  </div>
  <script src="/s/js/views/admin/log.js?v={{ mtime("/public/s/js/views/admin/log.js") }}"></script>
  {% endif %}
</div>
</div>
