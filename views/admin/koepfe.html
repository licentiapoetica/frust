{% include "snippets/header.html" %}
<div class="pagewrapper">
<div id="main" class="admin-container">
    {% include "snippets/admin-back.html" %}
    <div class="container">
        <h2>Köpfe Manager</h2>

        <div class="admin-form-container adm-koepfe-form">
            <h4 class="adm-koepfe-form-title">Upload Neuer Kopf</h4>
            <div class="adm-koepfe-form-row">
                <div>
                    <label class="adm-koepfe-label">Bild (PNG, JPG, GIF, WebP, AVIF)</label>
                    <input type="file" id="koepfe-file" class="adm-koepfe-file">
                </div>
                <button id="add-koepfe" class="btn-upload adm-koepfe-upload" data-csrf="{{ csrf_token }}">Upload</button>
            </div>
        </div>

        <div id="koepfe-list" class="emoji-grid"></div>
    </div>

    <script src="/s/js/views/admin/koepfe.js?v={{ mtime("/public/s/js/views/admin/koepfe.js") }}"></script>
</div>
</div>
{% include "snippets/footer.html" %}
