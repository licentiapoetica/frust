{% include "snippets/header.html" %}
<div class="pagewrapper">
<div id="main">
    {% include "snippets/admin-back.html" %}
<div class="container">
        <div class="admin-header-flex">
            <h2>Invite Tokens</h2>
            <button id="generate-token" class="btn-upload adm-tokens-generate">Generate New Token</button>
        </div>

        <!-- ═══════════════════ Invite Requests ═══════════════════ -->
        <div id="invite-requests" class="adm-tokens-requests">
            <h3 class="adm-tokens-heading">
                <i class="fa-solid fa-inbox adm-tokens-heading-icon"></i> Invite Requests
                <span id="invite-req-count" class="adm-tokens-req-count"></span>
            </h3>
            <div class="upload-form">
                <table class="responsive-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Submitted</th>
                            <th>Reviewed By</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invite-req-list">
                        <tr><td colspan="6" class="adm-tokens-empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <h3 class="adm-tokens-heading">
            <i class="fa-solid fa-ticket adm-tokens-heading-icon"></i> Token List
        </h3>
        <div class="upload-form">
            <table class="responsive-table">
                <thead>
                    <tr>
                        <th>Token</th>
                        <th>Status</th>
                        <th>Source</th>
                        <th>Used By</th>
                        <th>Created</th>
                        <th>Used At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="token-list">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

    <script src="/s/js/views/admin/tokens.js?v={{ mtime("/public/s/js/views/admin/tokens.js") }}"></script>
</div>
</div>
</div>
{% include "snippets/footer.html" %}
