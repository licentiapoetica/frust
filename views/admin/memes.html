{% include "snippets/header.html" %}
<div class="pagewrapper">
<div id="main" class="admin-container">
    {% include "snippets/admin-back.html" %}
    <div class="container">
        <h2>Meme Manager</h2>

        <div class="admin-form-container adm-memes-form-card">
            <h4>Add New Meme Template</h4>
            <div class="adm-memes-form-fields">
                <input type="text" id="meme-id" placeholder="Template ID (e.g. surprised-pikachu)" class="adm-memes-input">
                <input type="text" id="meme-name" placeholder="Display Name (e.g. Surprised Pikachu)" class="adm-memes-input">
                <input type="text" id="meme-url" placeholder="Image URL (Alternative to upload)" class="adm-memes-input">
                <div class="adm-memes-or">- OR -</div>
                <input type="file" id="meme-file" accept="image/*" class="adm-memes-input">
                <input type="text" id="meme-category" placeholder="Category (e.g. Classic, Reaction)" class="adm-memes-input">
                <button id="add-meme" class="btn-upload adm-memes-add-btn">Add Template</button>
            </div>
        </div>

        <div class="admin-table-container adm-memes-table-wrap">
            <table class="adm-memes-table">
                <thead>
                    <tr class="adm-memes-head-row">
                        <th class="adm-memes-cell">Preview</th>
                        <th class="adm-memes-cell">Name</th>
                        <th class="adm-memes-cell">Category</th>
                        <th class="adm-memes-cell">Template ID</th>
                        <th class="adm-memes-cell">Actions</th>
                    </tr>
                </thead>
                <tbody id="meme-list" data-csrf="{{ csrf_token }}">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Edit Meme Modal -->
        <div id="edit-meme-modal" class="modal-overlay adm-big-modal">
            <div class="modal-content adm-big-edit-box adm-memes-edit-box">
                <h3 class="adm-big-modal-title">Edit Meme Template</h3>
                
                <input type="hidden" id="edit-meme-id-db">
                
                <div class="adm-big-edit-fields">
                    <div>
                        <label class="adm-big-edit-label">Template ID (lowercase a-z, 0-9, - only)</label>
                        <input type="text" id="edit-meme-template-id" class="adm-big-edit-input">
                    </div>
                    
                    <div>
                        <label class="adm-big-edit-label">Display Name</label>
                        <input type="text" id="edit-meme-name" class="adm-big-edit-input">
                    </div>
                    
                    <div>
                        <label class="adm-big-edit-label">Category</label>
                        <input type="text" id="edit-meme-category" class="adm-big-edit-input">
                    </div>
                    
                    <div>
                        <label class="adm-big-edit-label">Image URL</label>
                        <input type="text" id="edit-meme-url" class="adm-big-edit-input">
                    </div>
                    
                    <div class="adm-memes-edit-or">- OR -</div>

                    <div>
                        <label class="adm-big-edit-label">Upload New Image File</label>
                        <input type="file" id="edit-meme-file" accept="image/*" class="adm-big-edit-input">
                    </div>
                </div>
                
                <div class="modal-actions adm-big-modal-actions">
                    <button data-on="click:memeCloseEditModal" class="btn-cancel adm-big-btn-cancel">Cancel</button>
                    <button data-on="click:memeSave" class="btn-save adm-big-btn-save">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/s/js/views/admin/memes.js?v={{ mtime("/public/s/js/views/admin/memes.js") }}"></script>
</div>
</div>
{% include "snippets/footer.html" %}
