<!doctype html>
<html theme="{% if theme is defined %}{{ theme }}{% else %}{{ (default_theme or "amoled") }}{% endif %}">
<head>
  <meta charset="utf-8" />
  <script src="/s/js/csp-actions.js?v={{ mtime("/public/s/js/csp-actions.js") }}"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ domain }}</title>
  <link rel="icon" type="image/gif" href="/s/img/favicon.gif" />
  <link rel="stylesheet" id="injected-gate-styles" href="/s/css/f0ckm.css?v={{ ts }}">
  <link rel="stylesheet" href="/s/css/gate.css?v={{ mtime("/public/s/css/gate.css") }}">
</head>
<body class="{{ ("layout-legacy" if default_layout == "legacy" else "layout-modern") }}">
       
  <div class="wrapper gate-example-wrapper">
      <h2>Example Gate</h2>
      <button type="button" data-on="click:openLoginGate">Login</button>
      
      <div id="gate-container">
          {% include "snippets/navbar.html" %}
          {% include "snippets/footer.html" %}
      </div>
  </div>

  <script nonce="{{ csp_nonce }}">
    function openLoginGate() {
      document.getElementById('gate-container').style.display = 'block';
      const tryOpen = () => {
        const m = document.getElementById('login-modal');
        if (m) { m.style.display = 'flex'; }
        else { setTimeout(tryOpen, 50); }
      };
      tryOpen();
    }
    F0ckActions.define({ openLoginGate: function() { openLoginGate(); } });
  </script>

</body>
</html>
