{% include "snippets/header.html" %}
<div class="pagewrapper">
    <div id="main">
        <div class="meme-layout-wrapper">
            <link rel="stylesheet" href="/s/css/meme-creator.css?v={{ mtime("/public/s/css/meme-creator.css") }}">
            <link rel="preload" href="/s/fonts/impact.woff" as="font" type="font/woff" crossorigin>
            <div class="meme-creator-container">
                <div class="meme-header">
                    <h1 class="meme-title">{{ t("meme.create_meme") }} {{ template.name }}</h1>            </div>
                <div class="meme-editor-layout">
                    <div class="canvas-wrapper">
                        <canvas id="memeCanvas"></canvas>
                    </div>

                    <div class="meme-controls">
                        <div id="customTemplateSelector" class="form-group">
                            <label for="customTemplateFile">{{ t("meme.select_image") }}</label>
                            <input type="file" id="customTemplateFile" accept="image/*">
                            <button id="selectCustomFileBtn" type="button" class="btn btn-secondary btn-block">
                                <i class="fa fa-image"></i> {{ t("meme.choose_file_btn") }}
                            </button>
                        </div>

                        <div id="textLayersContainer">
                            <!-- Dynamic inputs injected by JS -->
                        </div>

                        <button id="addText" class="btn btn-secondary btn-block">
                            <i class="fa fa-plus"></i> {{ t("meme.add_text_layer") }}
                        </button>
                            <div class="form-group meme-tags-group">
                                <label for="tags">{{ t("meme.tags_label") }}</label>
                                <input type="text" id="tags" value="meme, {{ (template.category or "General") }}" placeholder="meme, funny, ...">
                            </div>

                        <button id="uploadMeme" class="btn btn-primary btn-block">
                            <i class="fa fa-upload"></i> {{ t("meme.upload_btn") }}
                        </button>
                        <a href="/meme" class="btn btn-secondary btn-block">{{ t("meme.back_btn") }}</a>
                    </div>
                </div>
            </div>
        </div>

        <script nonce="{{ csp_nonce }}">
            window.memeTemplate = {
                id: {{ template.id|string|tojson }},
                url: {{ template.url|string|tojson }},
                name: {{ template.name|string|tojson }},
                category: {{ (template.category or "General")|string|tojson }},
                sub_category: {{ (template.sub_category or "")|string|tojson }}
            };
            window.csrf_token = {{ csrf_token|string|tojson }};
        </script>
        <script src="/s/js/meme-creator.js?v={{ ts|safe }}"></script>
    </div>
</div>
{% include "snippets/footer.html" %}
