<!doctype f0ck>
<html theme="{% if theme is defined %}{{ theme }}{% endif %}">
<head>
  <meta charset="utf-8">
  <script src="/s/js/csp-actions.js?v={{ mtime("/public/s/js/csp-actions.js") }}"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>login</title>
  <link rel="icon" {% if (custom_favicon and (custom_favicon|length > 0)) %}href="{{ custom_favicon }}"{% else %} type="image/gif" href="/s/img/favicon.gif"{% endif %} />
  <link href="/s/css/f0ckm.css?v={{ mtime("/public/s/css/f0ckm.css") }}" rel="stylesheet" />
</head>
<body class="login-page">
  <form class="login-form" method="post" action="/login" novalidate>
    <h2>{{ t("auth.login_title") }}</h2>
    {% if error %}
    <div class="flash-error">{{ error }}</div>
    {% endif %}
    <input type="text" name="username" placeholder="{{ t("auth.username_placeholder") }}" autocomplete="off" required />
    <input type="password" name="password" placeholder="{{ t("auth.password_placeholder") }}" autocomplete="off" required />
    <p><input type="checkbox" id="kmsi" name="kmsi" /> <label for="kmsi">{{ t("auth.stay_signed_in_label") }}</label></p>
    <button type="submit">{{ t("auth.login_title") }}</button>
    {% if smtp_enabled %}
    <div class="login-forgot">
      <a href="/forgot-password" class="login-forgot-link">{{ t("auth.forgot_password") }}</a>
    </div>
    {% endif %}
  </form>
</body>
</html>
