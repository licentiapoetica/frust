<div id="metadata-modal" class="modal-overlay metadata-modal-hidden">
    <div class="modal-content metadata-modal-content">
        <div class="metadata-modal-header">
            <div class="metadata-modal-heading">
                <h3><i class="fa-solid fa-magic"></i> {{ t("metadata_modal.title") }}</h3>
                <span class="metadata-modal-hint">{{ (t("metadata_modal.hint") or "Click a suggestion to add it as a tag, or select part of it to add just that.") }}</span>
            </div>
            <button type="button" class="metadata-modal-close-icon" id="metadata-modal-close" title="{{ t("common.close") }}">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="metadata-modal-body">
            <div id="metadata-loading" class="metadata-modal-loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span>{{ t("metadata_modal.loading") }}</span>
            </div>
            <div id="metadata-results" class="metadata-modal-hidden">
                <div class="metadata-modal-found">
                    <i class="fa-solid fa-tags"></i>
                    <span>{{ t("metadata_modal.found") }}</span>
                </div>
                <div class="meta-suggestions-list" id="metadata-suggestion-list">
                    <!-- Suggestions injected here -->
                </div>
                <div id="metadata-no-results" class="metadata-modal-hidden metadata-modal-empty">
                    {{ t("metadata_modal.no_results") }}
                </div>
            </div>
            <div id="metadata-error" class="metadata-modal-hidden metadata-modal-error"></div>
        </div>
        <div class="metadata-modal-footer">
            <button type="button" class="metadata-modal-close-btn" id="metadata-modal-cancel">{{ t("common.close") }}</button>
        </div>
    </div>
</div>
