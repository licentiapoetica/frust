<div id="metadata-modal" class="modal-overlay metadata-modal-hidden">
    <div class="modal-content metadata-modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-magic"></i> {{ t("metadata_modal.title") }}</h3>
        </div>
        <div class="modal-body metadata-modal-body">
            <div id="metadata-loading" class="metadata-modal-loading">
                <i class="fa fa-spinner fa-spin fa-2x"></i>
                <p>{{ t("metadata_modal.loading") }}</p>
            </div>
            <div id="metadata-results" class="metadata-modal-hidden">
                <p class="metadata-modal-found">{{ t("metadata_modal.found") }}</p>
                <div class="meta-suggestions-list" id="metadata-suggestion-list">
                    <!-- Pills injected here -->
                </div>
                <div id="metadata-no-results" class="metadata-modal-hidden metadata-modal-empty">
                    {{ t("metadata_modal.no_results") }}
                </div>
            </div>
            <div id="metadata-error" class="metadata-modal-hidden metadata-modal-error"></div>
        </div>
        <div class="modal-actions metadata-modal-actions">
            <button class="btn-secondary" id="metadata-modal-cancel">{{ t("common.close") }}</button>
        </div>
    </div>
</div>
