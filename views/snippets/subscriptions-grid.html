{% for key, item in items|entries %}
<div class="sub-card {{ ("anim-boxshadow is-pinned" if item.is_pinned else "") }}" id="sub-{{ item.id }}">
    <a href="/{{ (item.slug if (enable_item_slugs and item.slug) else item.id) }}" class="sub-link">
        <div class="thumb-indicators">
            {% if item.is_pinned %}
            <i class="fa-solid fa-thumbtack pin-indicator anim"></i>
            {% endif %}
        </div>
        <img src="{{ item.thumb }}" loading="lazy" />
        <div class="sub-info">
            <span class="sub-id">#{{ (item.slug if (enable_item_slugs and item.slug) else item.id) }}</span>
            <span class="sub-user">{{ (t("subscriptions.by_user")).replace("{user}", item.user, 1) }}</span>
        </div>  
    </a>
    <button class="unsub-btn" data-id="{{ item.id }}">{{ t("subscriptions.unsubscribe") }}</button>
</div>
{% endfor %}
